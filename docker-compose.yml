services:
  db:
    image: postgres:17-alpine
    container_name: dsvtn-db
    environment:
      POSTGRES_USER: dsvtn
      POSTGRES_PASSWORD: dsvtn_dev
      POSTGRES_DB: dsvtn
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dsvtn -d dsvtn']
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: uncomment to run backend in container
  # api:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   env_file: ./backend/.env
  #   ports:
  #     - '3001:3001'
  #   depends_on:
  #     db:
  #       condition: service_healthy

  # Optional: uncomment to run frontend in container
  # web:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   env_file: ./frontend/.env.local
  #   ports:
  #     - '3000:3000'

volumes:
  postgres_data:
